<div class="datepicker__div">
    <input matInput
           [matDatepicker]="picker"
           [required]="required"
           [value]="value"
           (dateChange)="onDateChange($event.value)"
           (blur)="onTouched()"
           class="dense-input" />

    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
</div>
